<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TESTE DE MIDIA</title>
    <style>

    
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 15px;
        }


        h1{
            text-align: center;
            margin-bottom: 20px;
        }

        body {
          background-color: olive;
          color: white;
        }


        .container{
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .box{
            max-width: 400px;
            width: 100%;
            height: 200px;
            background-color: black;
        }
        .container-position{
            margin-top: 10px;
            width: 100%;
            height: 600px;
            border: 2px solid blueviolet;
            position: relative;
        }
        .filho-tamanho{
            position: absolute;
            width: 200px;
            height: 300px;
            background-color: purple;
        }
        .container-position__filho01{
            top: 0;
            left: 0;
        }
        .container-position__filho02{
            top: 0;
            right: 0;
        }
        .container-position__filho03{
            bottom: 0;
            left: 0;
        }
        .container-position__filho04{
            bottom: 0;
            right: 0;
        }
        .whats{
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: rgb(0, 196, 49);
            
        }
        

        

        


        /* For devices with a minimum width of 768px (Medium) */
        @media (min-width: 768px) {
          body {
            background-color: blue;
            color: white;
            
            
          }
        .box{
            width: 300px;
           
          }
          
        }

/* For devices with a minimum width of 992px (Large) */
        @media  (min-width: 992px) {
          body {
            background-color: tan;
            color: black;
          }
        }

    
    
    </style>
</head>
<body>
    <h1>Testes com @MEDIA QUERY</h1>

    <div class="container">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>
    <div class="container-position">
        <div class="container-position_filho01 filho-tamanho"></div>
        <div class="container-position_filho02 filho-tamanho"></div>
        <div class="container-position_filho03 filho-tamanho"></div>
        <div class="container-position_filho04 filho-tamanho"></div>
    </div>
    
    
</body>
</html>
